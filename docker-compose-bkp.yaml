version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - ./db/.env
        # command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    image: shadowrg99/gmt-nm-be:v1.1
    restart: always
    env_file:
      - /home/devops/Downloads/medicaar_backend/.env
    depends_on:
      - mysql
    ports:
      - "7000:7000"

  frontend:
    image: shadowrg99/gmt-nm-fe:v1.1
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  db_data:
