frontend:
  image: shadowrg99/gmt-nm-fe:v1.1
  containerPort: 3000
  servicePort: 80

backend:
  image: shadowrg99/gmt-nm-be:v1.1
  containerPort: 7000
  servicePort: 7000
  env:
    - name: DB_HOST
      value: mysql
    - name: DB_USER
      value: appuser
    - name: DB_PASS
      value: StrongPassword123
    - name: DB_NAME
      value: appdb

mysql:
  image: mysql:5.7
  containerPort: 3306
  rootPassword: root
  database: appdb
  username: appuser
  password: StrongPassword123

