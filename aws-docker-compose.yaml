services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: mysql
    restart: always

    env_file:
      - .env_db
    
    volumes:
      - db_data:/var/lib/mysql
      - .nm-gmt.sql:/docker-entrypoint-initdb.d/nm-gmt.sql

    ports:
      - "3306:3306"

    networks:
      - docker-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 5
  
  backend:
    image: shadowrg99/gmt-nm-be:v1.2
    container_name: backend
    restart: always
    ports:
      - "7000:7000"

    env_file:
      - .env_be

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - docker-network
  
  frontend:
    image: shadowrg99/gmt-nm-fe:v3.1
    container_name: frontend
    restart: always
    ports: 
      - "8080:80"
    environment:
      API_URL: http://35.175.70.242:7000

    depends_on:
      - backend

    networks:
      - docker-network

volumes:
  db_data:

networks:
  docker-network:
    driver: bridge
